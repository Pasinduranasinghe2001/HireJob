databases:
  - name: hirejob-db
    databaseName: hirejob
    user: hirejob
    plan: free
    region: singapore

services:
  - type: web
    name: hirejob-backend
    runtime: docker
    rootDir: backend
    plan: free
    region: singapore
    envVars:
      - key: DB_URL
        sync: false # Format: jdbc:postgresql://<RENDER_DB_HOST>:5432/hirejob
      - key: DB_USERNAME
        fromDatabase:
          name: hirejob-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hirejob-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: FORWARD_HEADERS_STRATEGY
        value: "framework"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,https://*.vercel.app"
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
