server:
  port: ${PORT:${SERVER_PORT:8081}}
  # Never leak internals (stack traces / exception messages) to clients
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: strict
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}

spring:
  # Local secrets live in backend/.env (git-ignored). See backend/.env.example
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hirejob}
    username: ${DB_USERNAME:hirejob}
    password: ${DB_PASSWORD:hirejob123}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 26MB

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true
            required: true

app:
  jwt:
    # Override JWT_SECRET (Base64, >= 64 bytes) in production!
    secret: ${JWT_SECRET:4a6f624d61726b6574706c6163654869726553656372657432303234214a5754546f6b656e5369676e696e674b657948657265}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}        # 8 hours for normal users
    admin-expiration-ms: ${JWT_ADMIN_EXPIRATION_MS:1800000} # 30 minutes for admin sessions
  security:
    cookie-secure: ${COOKIE_SECURE:false}   # set true when served over HTTPS
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://*.vercel.app}
    login-otp-required: ${LOGIN_OTP_REQUIRED:true}
  admin:
    email: ${ADMIN_EMAIL:pasinduworkwebsite@gmail.com}
    password: ${ADMIN_PASSWORD:bByfa016}
    full-name: ${ADMIN_FULL_NAME:HireJob Administrator}
    allowed-ips: ${ADMIN_ALLOWED_IPS:}      # optional comma separated allow-list
  google:
    client-id: ${GOOGLE_CLIENT_ID:306552749425-8skeiqc87hn9j1k02154rpufc4td34rq.apps.googleusercontent.com}
  email:
    brevo-api-key: ${BREVO_API_KEY:}
    resend-api-key: ${RESEND_API_KEY:}
    webhook-url: ${EMAIL_WEBHOOK_URL:https://script.google.com/macros/s/AKfycbwi32H0p5JinBXK59ynnxW40ksSnSrwoVTqKRFauFknH2hnMleRGnjyzyyoDWUXpiKJ/exec}
    from-email: ${EMAIL_FROM:${SPRING_MAIL_USERNAME:pasinduworkwebsite@gmail.com}}
    from-name: ${EMAIL_FROM_NAME:HireJob Sri Lanka}
  sms:
    twilio-account-sid: ${TWILIO_ACCOUNT_SID:}
    twilio-auth-token: ${TWILIO_AUTH_TOKEN:}
    twilio-from-number: ${TWILIO_FROM_NUMBER:}

file:
  upload-dir: ${UPLOAD_DIR:uploads}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: warn
