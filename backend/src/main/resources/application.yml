    secret: 4a6f624d61726b6574706c6163654869726553656372657432303234214a5754546f6b656e5369676e696e674b657948657265
    expiration-ms: 86400000

file:
  upload-dir: uploads

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
