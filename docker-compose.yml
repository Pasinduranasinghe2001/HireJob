services:
  postgres:
    image: postgres:16-alpine
    container_name: hirejob-postgres
    environment:
      POSTGRES_DB: hirejob
      POSTGRES_USER: hirejob
      POSTGRES_PASSWORD: hirejob123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hirejob-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirejob"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hirejob-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hirejob-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  hirejob-network:
    driver: bridge
